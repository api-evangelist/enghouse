name: Enghouse
description: 'Enghouse Systems Limited (TSX: ENGH) is a publicly traded Canadian enterprise software and
  services company headquartered in Markham, Ontario and founded in 1984. It builds mission-critical,
  communications-focused software delivered on-premise and via the cloud, organized into two segments:
  the Interactive Management Group (Enghouse Interactive — omnichannel contact centre, customer experience,
  IVR, video collaboration and AI-assisted agent tooling) and the Asset Management Group (Enghouse Networks —
  telecom OSS/BSS, media and broadcast, and network monitoring; plus transportation, public-safety and transit
  systems). The company grows largely through acquisition of specialized software brands.'
